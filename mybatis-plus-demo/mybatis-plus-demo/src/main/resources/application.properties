server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DeepSeekDoc?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
spring.transaction.default-timeout=30s
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.time-zone=GMT+8
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
security.session-ttl-seconds=${SESSION_TTL_SECONDS:7200}
security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
security.ai-service-key=${AI_SERVICE_KEY:}
security.migrate-legacy-passwords=${MIGRATE_LEGACY_PASSWORDS:false}
payments.enabled=${PAYMENTS_ENABLED:false}
commerce.enabled=${COMMERCE_ENABLED:false}

commerce.evidence-enabled=${MEDICINE_EVIDENCE_ENABLED:false}
