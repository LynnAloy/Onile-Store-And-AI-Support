spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:m1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-schema.sql,classpath:sql/m1-security-tables.sql,classpath:sql/m3-profile-schema.sql,classpath:sql/m4-draft-schema.sql
      data-locations: classpath:sql/test-data.sql
security:
  ai-service-key: test-service-key-at-least-32-characters
  session-ttl-seconds: 7200
  migrate-legacy-passwords: false
logging:
  level:
    root: WARN
